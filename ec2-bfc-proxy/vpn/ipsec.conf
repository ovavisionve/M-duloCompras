# /etc/strongswan/ipsec.conf
# Túnel VPN IPSec — EC2 WEFLY ↔ BFC

config setup
    charondebug="ike 2, knl 2, cfg 2"

conn bfc-tunnel
    type=tunnel
    auto=start
    keyexchange=ikev2

    # === LADO WEFLY (EC2) ===
    left=%defaultroute
    leftid=3.219.103.87
    leftsubnet=172.31.59.48/32

    # === LADO BFC ===
    right=190.202.127.113
    rightsubnet=__SUBRED_BFC__   # <-- Pendiente: BFC debe dar la subred interna

    # === AUTENTICACIÓN — debe coincidir exactamente con los params del Excel ===
    authby=secret
    ike=3des-sha256-modp2048
    esp=3des-sha256
    ikelifetime=8h
    lifetime=1h
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s
