services:
  - type: web
    name: comprar-ia
    runtime: node
    plan: free
    buildCommand: npm install && cd frontend && npm install && npm run build && cd ..
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 8h
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: warn
